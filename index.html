<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yến Lộc - Auto Gallery Fix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --main-color: #38bdf8; }
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; }
        .header { margin-bottom: 15px; color: var(--main-color); font-weight: bold; font-size: 24px; text-transform: uppercase; letter-spacing: 5px; }
        
        /* Slide ngoài */
        .mySwiper { width: 100%; padding: 50px 0; }
        .mySwiper .swiper-slide { width: 280px; height: 400px; border-radius: 20px; overflow: hidden; background: #111; cursor: pointer; border: 1px solid #333; }
        .mySwiper img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 0.5s; }
        .mySwiper img.loaded { opacity: 1; }

        /* Slide phóng to */
        #fs-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .fsSwiper { width: 100%; height: 90%; }
        .fsSwiper .swiper-slide { display: flex; align-items: center; justify-content: center; }
        .fsSwiper img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 10px; border: 1px solid var(--main-color); }
        
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 50px; color: var(--main-color); cursor: pointer; z-index: 10001; }
        .swiper-button-next, .swiper-button-prev { color: var(--main-color) !important; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">YẾN LỘC - AUTO GALLERY</div>
        <div id="loading" style="color: var(--main-color);">Đang quét ảnh...</div>
        <div class="swiper mySwiper">
            <div id="wrapper" class="swiper-wrapper"></div>
        </div>
    </div>

    <div id="fs-view">
        <span class="close-btn" onclick="closeFS()">&times;</span>
        <div class="swiper fsSwiper">
            <div id="fs-wrapper" class="swiper-wrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const GITHUB_USER = "locvitinh-blip"; 
        const GITHUB_REPO = "gallery";
        const FOLDER_PATH = "img"; 

        let mainSwiper, fsSwiper;
        const effects = ["fade", "flip", "cube", "cards"];

        async function loadImages() {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
            try {
                const res = await fetch(url);
                const files = await res.json();
                const wrapper = document.getElementById('wrapper');
                const fsWrapper = document.getElementById('fs-wrapper');
                let count = 0;

                files.forEach((file) => {
                    if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        const imgUrl = file.download_url;
                        const idx = count;
                        
                        // Slide ngoài
                        const slide = document.createElement('div');
                        slide.className = 'swiper-slide';
                        slide.onclick = () => openFS(idx);
                        slide.innerHTML = `<img src="${imgUrl}" onload="this.classList.add('loaded')" loading="lazy">`;
                        wrapper.appendChild(slide);

                        // Slide trong
                        const fsSlide = document.createElement('div');
                        fsSlide.className = 'swiper-slide';
                        fsSlide.innerHTML = `<img src="${imgUrl}">`;
                        fsWrapper.appendChild(fsSlide);
                        count++;
                    }
                });
                document.getElementById('loading').style.display = 'none';
                initSwipers();
            } catch (e) { document.getElementById('loading').innerText = "Lỗi tải ảnh!"; }
        }

        function initSwipers() {
            mainSwiper = new Swiper(".mySwiper", {
                effect: "coverflow",
                centeredSlides: true,
                slidesPerView: "auto",
                loop: true,
                autoplay: { delay: 3000 }
            });

            fsSwiper = new Swiper(".fsSwiper", {
                loop: true,
                speed: 1000,
                autoplay: { 
                    delay: 3000,
                    disableOnInteraction: false // Quan trọng: Bấm nút xong vẫn tự chạy tiếp
                },
                navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }
            });
        }

        function openFS(index) {
            // Đổi hiệu ứng ngẫu nhiên mỗi lần mở
            const effect = effects[Math.floor(Math.random() * effects.length)];
            fsSwiper.params.effect = effect;
            
            document.getElementById('fs-view').style.display = 'flex';
            
            fsSwiper.update(); // Cập nhật lại Swiper
            fsSwiper.slideToLoop(index, 0); // Nhảy tới ảnh đã chọn
            
            // Lệnh quan trọng nhất để sửa lỗi đứng im:
            setTimeout(() => {
                fsSwiper.autoplay.runOnEveryTick = true;
                fsSwiper.autoplay.start();
            }, 100);
        }

        function closeFS() {
            document.getElementById('fs-view').style.display = 'none';
            fsSwiper.autoplay.stop();
        }

        loadImages();
    </script>
</body>
</html>
