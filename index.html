<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yên Lộc - Digital Gallery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .header { margin-bottom: 20px; color: #38bdf8; font-weight: bold; font-size: 22px; text-transform: uppercase; letter-spacing: 3px; }
        .swiper { width: 100%; padding: 50px 0; }
        .swiper-slide { width: 280px; height: 380px; border-radius: 15px; overflow: hidden; background: #111; cursor: pointer; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        #fs-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 9999; align-items: center; justify-content: center; }
        #fs-view img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .close-x { position: absolute; top: 20px; right: 30px; font-size: 45px; color: #38bdf8; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div id="status" style="color: #666; margin-bottom: 10px;">Đang quét ảnh từ Blogspot...</div>
        <div class="header">YÊN LỘC - DIGITAL GALLERY</div>
        <div class="swiper mySwiper">
            <div id="gallery-wrapper" class="swiper-wrapper">
                </div>
        </div>
    </div>

    <div id="fs-view">
        <span class="close-x" onclick="closeFS()">&times;</span>
        <img id="fs-img" src="" />
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const blogURL = "https://yenlocne.blogspot.com";
        let allPhotos = [];

        async function loadPhotos() {
            // Sử dụng Proxy miễn phí của AllOrigins để vượt rào cản CORS
            const proxy = "https://api.allorigins.win/get?url=";
            const apiTarget = encodeURIComponent(`${blogURL}/feeds/posts/default?alt=json&max-results=500`);
            
            try {
                const response = await fetch(proxy + apiTarget);
                const result = await response.json();
                const data = JSON.parse(result.contents); // Giải mã dữ liệu từ proxy
                
                const entries = data.feed.entry || [];
                const wrapper = document.getElementById('gallery-wrapper');
                const status = document.getElementById('status');

                if (entries.length === 0) {
                    status.innerText = "Không tìm thấy bài viết nào công khai.";
                    return;
                }

                entries.forEach(entry => {
                    let url = "";
                    if (entry.media$thumbnail) {
                        url = entry.media$thumbnail.url.replace('/s72-c/', '/s1600/');
                        allPhotos.push(url);
                        
                        const slide = document.createElement('div');
                        slide.className = 'swiper-slide';
                        slide.onclick = () => openFS(url);
                        slide.innerHTML = `<img src="${url.replace('/s1600/', '/s400/')}" />`;
                        wrapper.appendChild(slide);
                    }
                });

                status.style.display = "none";
                initSwiper();
            } catch (e) {
                console.error(e);
                document.getElementById('status').innerText = "Lỗi kết nối hoặc Blog đang để chế độ riêng tư.";
            }
        }

        function initSwiper() {
            new Swiper(".mySwiper", {
                effect: "coverflow",
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: "auto",
                loop: true,
                autoplay: { delay: 2500 },
                coverflowEffect: { rotate: 30, stretch: 0, depth: 100, modifier: 1, slideShadows: true },
            });
        }

        function openFS(url) {
            document.getElementById('fs-img').src = url;
            document.getElementById('fs-view').style.display = 'flex';
        }

        function closeFS() {
            document.getElementById('fs-view').style.display = 'none';
        }

        loadPhotos();
    </script>
</body>
</html>
