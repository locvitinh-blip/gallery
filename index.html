<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yên Lộc - Auto Gallery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle, #111 0%, #000 100%); }
        .header { margin-bottom: 10px; color: #38bdf8; font-weight: bold; font-size: 24px; text-transform: uppercase; letter-spacing: 5px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        
        /* Cấu hình khung ảnh */
        .swiper { width: 100%; padding: 50px 0; }
        .swiper-slide { width: 280px; height: 400px; border-radius: 20px; overflow: hidden; background: #1a1a1a; cursor: pointer; border: 1px solid #333; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .swiper-slide:hover { border-color: #38bdf8; transform: translateY(-10px); }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .swiper-slide img.loaded { opacity: 1; }

        /* Xem ảnh toàn màn hình */
        #fs-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        #fs-view img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 10px; box-shadow: 0 0 50px rgba(0,0,0,1); }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 60px; color: #38bdf8; cursor: pointer; line-height: 1; }
        
        /* Hiệu ứng chờ load */
        .loader { border: 4px solid #222; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">YÊN LỘC - AUTO SCAN</div>
        <div id="status-container">
            <div class="loader" id="main-loader"></div>
            <p id="msg" style="color: #38bdf8; margin-top: 15px; font-size: 14px;">Đang quét thư mục ảnh...</p>
        </div>
        
        <div class="swiper mySwiper">
            <div id="wrapper" class="swiper-wrapper"></div>
        </div>
    </div>

    <div id="fs-view" onclick="closeFS()">
        <span class="close-btn">&times;</span>
        <img id="fs-img" src="" />
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // --- CẤU HÌNH GITHUB ---
        const GITHUB_USER = "locvitinh-blip";  // Ví dụ: locvitinh
        const GITHUB_REPO = "gallery";     // Ví dụ: YenLoc_Rescue
        const FOLDER_PATH = "img";          // Tên thư mục bạn vừa tạo

        async function initGallery() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
            
            try {
                const res = await fetch(apiUrl);
                const files = await res.json();
                const wrapper = document.getElementById('wrapper');
                let foundImages = 0;

                if (!Array.isArray(files)) throw new Error("Thư mục không tồn tại");

                files.forEach(file => {
                    // Chỉ lấy file định dạng ảnh
                    if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        const imgUrl = file.download_url;
                        const slide = document.createElement('div');
                        slide.className = 'swiper-slide';
                        slide.onclick = () => openFS(imgUrl);
                        slide.innerHTML = `<img src="${imgUrl}" onload="this.classList.add('loaded')" loading="lazy">`;
                        wrapper.appendChild(slide);
                        foundImages++;
                    }
                });

                if (foundImages > 0) {
                    document.getElementById('status-container').style.display = 'none';
                    startSwiper();
                } else {
                    document.getElementById('msg').innerText = "Thư mục 'img' đang trống!";
                    document.getElementById('main-loader').style.display = 'none';
                }

            } catch (err) {
                document.getElementById('msg').innerText = "Lỗi: Không tìm thấy thư mục hoặc sai Username/Repo";
                document.getElementById('main-loader').style.display = 'none';
            }
        }

        function startSwiper() {
            new Swiper(".mySwiper", {
                effect: "coverflow",
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: "auto",
                loop: true,
                autoplay: { delay: 2500, disableOnInteraction: false },
                coverflowEffect: { rotate: 30, stretch: 0, depth: 150, modifier: 1, slideShadows: true }
            });
        }

        function openFS(url) {
            document.getElementById('fs-img').src = url;
            document.getElementById('fs-view').style.display = 'flex';
        }

        function closeFS() {
            document.getElementById('fs-view').style.display = 'none';
        }

        initGallery();
    </script>
</body>
</html>
